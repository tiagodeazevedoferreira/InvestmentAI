name: Phase 10 Live Gate Tests

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  live-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Phase 10 authorization tests
        run: python -m unittest discover -s tests -p 'test_phase10_live_gate.py' -v
