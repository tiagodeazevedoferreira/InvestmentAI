name: OpenBB B3 smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/services/openbb_market_data.py'
      - 'backend/requirements.txt'
      - 'scripts/openbb_b3_smoke.py'
      - '.github/workflows/openbb-b3-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Validate B3 symbols through OpenBB/yfinance
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/openbb_b3_smoke.py
