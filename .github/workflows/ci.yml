name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: pytest -q
      - name: Run walk-forward stability analysis
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python scripts/run_walk_forward.py > walk_forward_output.txt
      - name: Upload walk-forward report
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-stability-report
          path: |
            walk_forward_report.json
            walk_forward_output.txt
