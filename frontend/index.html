<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>InvestmentAI</title><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#111827}main{max-width:1100px;margin:auto;padding:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 10px #0001}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}input{padding:10px;width:100%;box-sizing:border-box}</style></head><body><main><h1>InvestmentAI</h1><p>Pesquisa, simulação, risco e inteligência quantitativa.</p><div class="card"><label>Backend URL</label><input id="api" placeholder="https://seu-backend.example.com"><br><br><label>Ativo</label><input id="symbol" value="PETR4.SA"><br><br><button onclick="loadMarket()">Consultar</button></div><section class="grid" id="result"></section></main><script>async function loadMarket(){const api=document.getElementById('api').value.replace(/\/$/,'');const s=document.getElementById('symbol').value;const r=document.getElementById('result');if(!api){r.innerHTML='<div class="card">Informe a URL do backend.</div>';return}try{const x=await fetch(api+'/api/market/'+encodeURIComponent(s));if(!x.ok)throw new Error(await x.text());const d=await x.json();r.innerHTML='<div class="card"><b>Preço</b><h2>'+d.close.toFixed(2)+'</h2></div><div class="card"><b>EMA 9</b><h2>'+d.ema9.toFixed(2)+'</h2></div><div class="card"><b>EMA 21</b><h2>'+d.ema21.toFixed(2)+'</h2></div><div class="card"><b>RSI 14</b><h2>'+(d.rsi14??'N/D')+'</h2></div>'}catch(e){r.innerHTML='<div class="card">Erro: '+e.message+'</div>'}}</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
