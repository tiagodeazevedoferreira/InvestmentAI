name: Walk-Forward ML Baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: pytest -q tests/test_walk_forward.py
      - name: Run B3 walk-forward
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python scripts/run_walk_forward.py
