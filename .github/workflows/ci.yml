name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: pytest -q
      - name: Run walk-forward analysis
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python scripts/run_walk_forward.py > walk_forward_output.txt
      - name: Generate walk-forward stability summary
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          python scripts/summarize_walk_forward.py walk_forward_report.json > walk_forward_stability.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("walk_forward_stability.json").read_text(encoding="utf-8"))
          print("=== WALK-FORWARD STABILITY SUMMARY ===")
          for symbol, metrics in data.items():
              print(
                  f"{symbol}: folds={metrics['folds']} | "
                  f"BA model={metrics['model_balanced_accuracy_mean']:.4f} | "
                  f"BA baseline={metrics['baseline_balanced_accuracy_mean']:.4f} | "
                  f"BA delta={metrics['mean_balanced_accuracy_delta']:.4f} | "
                  f"F1 model={metrics['model_macro_f1_mean']:.4f} | "
                  f"F1 baseline={metrics['baseline_macro_f1_mean']:.4f} | "
                  f"win rate BA={metrics['fold_win_rate_balanced_accuracy']:.2%} | "
                  f"win rate F1={metrics['fold_win_rate_macro_f1']:.2%}"
              )
          PY
      - name: Run causal ML trading backtest
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python scripts/run_ml_trading_backtest.py > ml_trading_backtest_output.txt
      - name: Run ML robustness audit
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python scripts/run_ml_robustness_audit.py > ml_robustness_audit_output.txt
      - name: Run ML model diagnosis
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python scripts/run_ml_model_diagnosis.py > ml_model_diagnosis_output.txt
      - name: Upload trading backtest report
        uses: actions/upload-artifact@v4
        with:
          name: ml-trading-backtest-report
          path: |
            ml_trading_backtest_output.txt
            artifacts/ml-trading-backtest-report.json
      - name: Upload ML robustness audit
        uses: actions/upload-artifact@v4
        with:
          name: ml-robustness-audit-report
          path: |
            ml_robustness_audit_output.txt
            artifacts/ml-robustness-audit.json
      - name: Upload ML model diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: ml-model-diagnosis-report
          path: |
            ml_model_diagnosis_output.txt
            artifacts/ml-model-diagnosis.json
      - name: Upload walk-forward report
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-stability-report
          path: |
            walk_forward_report.json
            walk_forward_output.txt
            walk_forward_stability.json
