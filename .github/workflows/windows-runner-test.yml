name: Windows Self-Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  validate-windows-runner:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Validate runner identity
        shell: pwsh
        run: |
          Write-Host "=== RUNNER ==="
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

          if ($env:RUNNER_NAME -ne "ECTIN8F38594") {
              throw "Unexpected runner: $env:RUNNER_NAME"
          }

      - name: Validate Windows
        shell: pwsh
        run: |
          Write-Host "=== WINDOWS ==="
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsArchitecture

      - name: Validate Python
        shell: pwsh
        run: |
          Write-Host "=== PYTHON ==="
          py -3.12 --version
          .\.venv\Scripts\python.exe --version

      - name: Validate Git
        shell: pwsh
        run: |
          Write-Host "=== GIT ==="
          git --version

      - name: Validate repository
        shell: pwsh
        run: |
          Write-Host "=== REPOSITORY ==="
          git status --short
          git branch --show-current

      - name: Run safe Python validation
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -c "import sys; print('Python executable:', sys.executable); print('Python version:', sys.version); print('WINDOWS_RUNNER_VALIDATION_OK')"
