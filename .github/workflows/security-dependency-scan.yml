name: Security and Dependency Scan

on:
  pull_request:
  push:
    branches:
      - main
      - "task-*"

jobs:
  security:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python 3.12
        run: |
          $python = (& py -3.12 -c "import sys; print(sys.executable)").Trim()
          if (-not (Test-Path $python)) {
            throw "Python 3.12 executable not found: $python"
          }
          $pythonDir = Split-Path -Parent $python
          $scriptsDir = Join-Path $pythonDir "Scripts"
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path $scriptsDir) {
            $scriptsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          & $python --version
          Write-Host "Using Python: $python"

      - name: Verify Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Install security scanners
        run: python -m pip install pip-audit bandit

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

      - name: Static security scan
        run: python -m bandit -r app -lll -iii

      - name: Backend tests
        run: |
          $env:PYTHONPATH = "..;" + $env:PYTHONPATH
          python -m pytest -q

      - name: Backend compile
        run: python -m compileall -q app
