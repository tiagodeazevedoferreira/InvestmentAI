name: External Intelligence Validation

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: External intelligence tests
        run: python -m unittest discover -s tests -p 'test_external_intelligence.py' -v
