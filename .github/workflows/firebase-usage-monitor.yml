name: Firebase Usage Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - ".github/workflows/firebase-usage-monitor.yml"
      - "backend/app/services/firebase_governance.py"
      - "scripts/monitor_firebase_usage.py"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Measure Firebase usage
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
          FIREBASE_USAGE_WARNING_BYTES: ${{ vars.FIREBASE_USAGE_WARNING_BYTES }}
          FIREBASE_USAGE_CRITICAL_BYTES: ${{ vars.FIREBASE_USAGE_CRITICAL_BYTES }}
          FIREBASE_MONITOR_PATHS: ${{ vars.FIREBASE_MONITOR_PATHS }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/monitor_firebase_usage.py
          echo "## Firebase usage monitor" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat firebase-usage-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish usage report
        uses: actions/upload-artifact@v4
        with:
          name: firebase-usage-report
          path: firebase-usage-report.json
          retention-days: 30
