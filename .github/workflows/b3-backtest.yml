name: B3 Backtest

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/run_b3_backtest.py'
      - 'tests/test_b3_backtest.py'
      - '.github/workflows/b3-backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: pytest -q tests/test_b3_backtest.py tests/test_market_replay.py tests/test_backtesting.py
      - name: Run real B3 backtest
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python scripts/run_b3_backtest.py
      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: b3-backtest-report
          path: artifacts/b3-backtest-report.json
